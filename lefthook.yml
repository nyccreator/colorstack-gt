# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: bun oxlint --fix --report-unused-disable-directives-severity=error {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: bun oxfmt --write {staged_files}
      stage_fixed: true
